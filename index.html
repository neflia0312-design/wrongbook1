<script>
const K='wrongbook_v3_2_1';
const SOURCE_KEYS=['wrongbook_v3_2_1','wrongbook_v3_2','wrongbook_v3_1','wrongbook_v3','wrongbook_v2_fixed','wrongbook_v2','wrongbook_v1'];
let MIGRATION_SOURCE='new';
function safeParseKey(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function qArrayOf(x){return Array.isArray(x?.qs)?x.qs:(Array.isArray(x?.questions)?x.questions:[])}
function bArrayOf(x){return Array.isArray(x?.books)?x.books:[]}
function scoreData(x){return qArrayOf(x).length*1000+bArrayOf(x).length}
let candidates=SOURCE_KEYS.map(k=>({k,d:safeParseKey(k)})).filter(x=>x.d&&typeof x.d==='object');
let best=candidates.sort((a,b)=>scoreData(b.d)-scoreData(a.d))[0];
let D=best?best.d:{books:[],qs:[]};
MIGRATION_SOURCE=best?best.k:'new';
if(!Array.isArray(D.books))D.books=[];
if(!Array.isArray(D.qs))D.qs=Array.isArray(D.questions)?D.questions:[];
D.books=D.books.map((b,i)=>({
  ...b,
  id:b.id||('book_'+i),
  name:b.name||b.title||('错题本 '+(i+1)),
  title:b.title||b.name||('错题本 '+(i+1)),
  sub:b.sub||b.subject||'',
  coverColor:b.coverColor||['#8f9a88','#7e8998','#b78f92','#d8b9bf','#b6a88e'][i%5],
  coverImage:b.coverImage||'',
  font:b.font||'sans',
  paper:b.paper||['ruled','dot','clean','floral','grid'][i%5],
  titleColor:b.titleColor||'#ffffff',
  strokeColor:b.strokeColor||'#000000',
  strokeWidth:Number(b.strokeWidth||0)
}));
D.qs=D.qs.map((q,i)=>({
  ...q,
  id:q.id||('q_'+i),
  book:q.book||q.bookId||'',
  type:q.type||'choice',
  opts:q.opts||q.options||[],
  ans:q.ans||q.answer||'',
  answer:q.answerText||q.answer||'',
  level:Number(q.level||0),
  next:q.next??q.nextReviewDay??day?.()??0,
  right:Number(q.right||0),
  wrong:Number(q.wrong||0)
}));
localStorage.setItem(K,JSON.stringify(D)); let mem={list:[],i:0}, quiz={list:[],i:0,score:0,locked:false};
const $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), day=()=>Math.floor(Date.now()/86400000);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function save(){try{localStorage.setItem(K,JSON.stringify(D));render();if(typeof renderV3Books==='function')renderV3Books();return true}catch(e){alert('保存失败：'+(e?.message||'浏览器存储异常'));return false}}
function page(x,b){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));$(x).classList.add('on');document.querySelectorAll('nav button').forEach(e=>e.classList.remove('on'));if(b)b.classList.add('on');if(x==='bank')renderBank()}
function modal(h){$('sheet').innerHTML=h;$('modal').classList.add('on')} function closeM(){$('modal').classList.remove('on')} $('modal').onclick=e=>{if(e.target.id==='modal')closeM()}
function newBook(){modal(`<h2>新建错题本</h2><label>名称</label><input id="bn" placeholder="例如：艺术概论"><label>科目说明</label><input id="bs" placeholder="例如：专升本"><div class="row" style="margin-top:17px"><button class="secondary" onclick="closeM()">取消</button><button class="primary" style="flex:1" onclick="saveBook()">创建</button></div>`)}
function saveBook(){if(!$('bn').value.trim())return alert('请输入名称');D.books.push({id:id(),name:$('bn').value.trim(),sub:$('bs').value.trim()});closeM();save()}

const APPEARANCE_KEYS=[
  'wrongbook_v3_2_1','wrongbook_v3_2','wrongbook_v3_1','wrongbook_v3',
  'wrongbook_v2_fixed','wrongbook_v2','wrongbook_v1'
];

function styleScore(b){
  let s=0;
  if(b?.coverImage)s+=100;
  if(b?.coverColor)s+=20;
  if(b?.paper)s+=15;
  if(b?.font)s+=10;
  if(b?.titleColor)s+=8;
  if(b?.strokeColor)s+=5;
  if(Number(b?.strokeWidth||0)>0)s+=5;
  return s;
}

function findAppearanceCandidatesFor(current){
  const all=[];
  for(const key of APPEARANCE_KEYS){
    try{
      const raw=JSON.parse(localStorage.getItem(key)||'null');
      const books=Array.isArray(raw?.books)?raw.books:[];
      for(const b of books){
        const sameId=current.id && b.id===current.id;
        const sameTitle=(b.title||b.name||'').trim()===(current.title||current.name||'').trim();
        const sameSubject=(b.subject||b.sub||'').trim() && (b.subject||b.sub||'').trim()===(current.subject||current.sub||'').trim();
        if(sameId || sameTitle || sameSubject){
          all.push({key,book:b,score:styleScore(b)});
        }
      }
    }catch(e){}
  }
  return all.sort((a,b)=>b.score-a.score);
}

function scanAppearanceRecovery(){
  const host=$('appearanceRecoveryResults');
  if(!D.books.length){host.innerHTML='<div class="appearanceItem">当前没有错题本。</div>';return}
  const rows=[];
  window.__appearanceRecoveries={};
  for(const current of D.books){
    const cands=findAppearanceCandidatesFor(current);
    const best=cands[0];
    if(best && best.score>0){
      const id='a_'+current.id;
      window.__appearanceRecoveries[id]={currentId:current.id,source:best};
      rows.push(`<div class="appearanceItem"><b>${esc(current.title||current.name||'未命名错题本')}</b><span class="small">找到旧外观：${best.key}${best.book.coverImage?' · 自定义封面':''}${best.book.paper?` · ${best.book.paper}`:''}</span><button class="secondary" style="width:100%;margin-top:7px" onclick="restoreAppearance('${id}')">只恢复这本的外观</button></div>`);
    }
  }
  host.innerHTML=rows.length?rows.join(''):'<div class="appearanceItem">没有扫描到比当前更完整的旧封面/内页设置。题目不会受影响。</div>';
}

function restoreAppearance(token){
  const rec=(window.__appearanceRecoveries||{})[token];
  if(!rec)return;
  const cur=D.books.find(b=>b.id===rec.currentId);
  const src=rec.source.book;
  if(!cur)return;
  const fields=['coverImage','coverColor','font','paper','titleColor','strokeColor','strokeWidth'];
  for(const f of fields){
    if(src[f]!==undefined && src[f]!==null && src[f]!=='')cur[f]=src[f];
  }
  // legacy cover names fallback
  if(!src.coverColor && src.cover){
    const legacy={cover1:'#8f9a88',cover2:'#7e8998',cover3:'#b78f92',cover4:'#b6a88e'};
    if(legacy[src.cover])cur.coverColor=legacy[src.cover];
  }
  if(save()){
    if(typeof renderV3Books==='function')renderV3Books();
    scanAppearanceRecovery();
    alert('外观已恢复。题目内容没有被修改。');
  }
}

let __appendPayload=null;

function normalizeAppendQuestions(raw){
  if(!raw||typeof raw!=='object')throw new Error('文件格式无效');
  const arr=Array.isArray(raw.questions)?raw.questions:(Array.isArray(raw.qs)?raw.qs:[]);
  if(!arr.length)throw new Error('文件中没有找到题目');
  return arr.map((q,i)=>{
    const opts=Array.isArray(q.opts)?q.opts:(Array.isArray(q.options)?q.options:[]);
    const ans=String(q.ans||q.answer||'').trim();
    const isChoice=(q.type==='choice')||opts.length>0||/^[A-D]$/i.test(ans);
    return {
      ...q,
      id:uid(),
      type:q.type||(isChoice?'choice':'short'),
      text:q.text||q.question||'',
      opts:opts,
      options:opts,
      ans:isChoice?ans.toUpperCase():(q.ans||''),
      answer:isChoice?ans.toUpperCase():(q.answerText||q.answer||''),
      tag:q.tag||'',
      note:q.note||'',
      wrong:Number(q.wrong||0),
      right:Number(q.right||0),
      level:Number(q.level||0),
      next:q.next??q.nextReviewDay??0,
      created:Date.now()+i
    };
  });
}

function confirmAppendImport(){
  if(!__appendPayload)return;
  const target=$('appendTarget').value;
  const book=D.books.find(b=>b.id===target);
  if(!book){alert('没有找到目标错题本');return}
  const existingTexts=new Set(D.qs.filter(q=>(q.book||q.bookId)===target).map(q=>String(q.text||'').trim()));
  let added=0,skipped=0;
  for(const q of __appendPayload.questions){
    const key=String(q.text||'').trim();
    if(key && existingTexts.has(key)){skipped++;continue}
    q.book=target;q.bookId=target;D.qs.push(q);
    if(key)existingTexts.add(key);
    added++;
  }
  if(save()){
    closeM();__appendPayload=null;
    if(typeof renderV3Books==='function')renderV3Books();
    showImportSuccess(target,added,skipped);
  }
}

function normalizeImportedData(raw){
  if(!raw || typeof raw!=='object') throw new Error('备份文件格式无效');
  const booksRaw=Array.isArray(raw.books)?raw.books:[];
  const qsRaw=Array.isArray(raw.qs)?raw.qs:(Array.isArray(raw.questions)?raw.questions:[]);
  if(!booksRaw.length && !qsRaw.length) throw new Error('备份中没有找到错题本或题目');

  const books=booksRaw.map((b,i)=>({
    ...b,
    id:b.id||('import_book_'+i+'_'+Date.now()),
    name:b.name||b.title||b.subject||('错题本 '+(i+1)),
    title:b.title||b.name||b.subject||('错题本 '+(i+1)),
    sub:b.sub||b.subject||'',
    coverColor:b.coverColor||['#8f9a88','#7e8998','#b78f92','#d8b9bf','#b6a88e'][i%5],
    coverImage:b.coverImage||'',
    font:b.font||'sans',
    paper:b.paper||['ruled','dot','clean','floral','grid'][i%5],
    titleColor:b.titleColor||'#ffffff',
    strokeColor:b.strokeColor||'#000000',
    strokeWidth:Number(b.strokeWidth||0)
  }));

  // If a legacy question references a book id that exists, keep it exactly.
  const fallbackBook=books[0]?.id||'';
  const qs=qsRaw.map((q,i)=>{
    const options=Array.isArray(q.opts)?q.opts:(Array.isArray(q.options)?q.options:[]);
    const isChoice=options.length>0 || /^[A-D]$/i.test(String(q.ans||q.answer||''));
    const legacyAnswer=String(q.ans||q.answer||'').trim();
    return {
      ...q,
      id:q.id||('import_q_'+i+'_'+Date.now()),
      book:q.book||q.bookId||fallbackBook,
      bookId:q.bookId||q.book||fallbackBook,
      type:q.type||(isChoice?'choice':'short'),
      text:q.text||q.question||'',
      opts:options,
      options:options,
      ans:isChoice?legacyAnswer.toUpperCase():(q.ans||''),
      answer:isChoice?legacyAnswer.toUpperCase():(q.answerText||q.answer||''),
      tag:q.tag||'',
      note:q.note||'',
      level:Number(q.level||0),
      next:q.next??q.nextReviewDay??0,
      right:Number(q.right||0),
      wrong:Number(q.wrong||0),
      created:q.created||Date.now()
    };
  });
  return {books,qs};
}
function importBackupFile(file){

      D=converted;
      localStorage.setItem(K,JSON.stringify(D));
      render();
      if(typeof renderV3Books==='function')renderV3Books();
      if(typeof updateDataStatus==='function')updateDataStatus();
      alert(`恢复成功：${D.books.length} 本错题本，${D.qs.length} 道题。`);
    }catch(err){alert('恢复失败：'+(err?.message||'无法识别备份文件'))}
  };
  r.readAsText(file);
}


$('appendImp').onchange=e=>{let f=e.target.files[0];if(!f)return;openAppendTargetPicker(f);e.target.value=''};

$('imp').onchange=e=>{let f=e.target.files[0];if(!f)return;importBackupFile(f)}
$('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});render();

function updateDataStatus(){
  const el=$('dataStatus');
  if(!el)return;
  const sourceNames={
    wrongbook_v3_2_1:'V3.2',
    wrongbook_v3_1:'V3.1',
    wrongbook_v3:'V3',
    wrongbook_v2_fixed:'V2',
    wrongbook_v2:'V2',
    wrongbook_v1:'V1',
    new:'新题库'
  };
  el.innerHTML=`已读取：<b>${sourceNames[MIGRATION_SOURCE]||MIGRATION_SOURCE}</b><br>错题本：${D.books.length} 本 · 题目：${D.qs.length} 道<br>当前保存目标：V3.2 本地题库`;
}

updateDataStatus();
</script>
<script>
/* ===== V3 behavior; keeps the V2 localStorage key and all existing questions ===== */
const V3COLORS=['#8f9a88','#7e8998','#b78f92','#d8b9bf','#b6a88e','#8f7f73','#a8a0b6','#6f7f78','#d9a0a8','#aab7a2'];
let pendingCover='';
let memV34={book:'',mode:'keywords',i:0};
function subjectiveQs(b){return D.qs.filter(q=>bookIdOf(q)===b&&q.type!=='choice'&&String(q.answer||q.ans||'').trim())}
function answerOf(q){return String(q.answer||q.ans||'').trim()}
function autoKeywords(q){
 if(Array.isArray(q.memoryKeywords)&&q.memoryKeywords.length)return q.memoryKeywords;
 let seg=answerOf(q).split(/\n|（\d+）|[。；;]/).map(x=>x.replace(/^[①②③④⑤⑥⑦⑧⑨⑩\d、.．\s]+/,'').trim()).filter(x=>x.length>=4),w=[];
 for(const s of seg){let c=s.match(/[\u4e00-\u9fa5A-Za-z·“”]{2,10}/g)||[];w.push(...c.sort((a,b)=>b.length-a.length).slice(0,2))}
 q.memoryKeywords=[...new Set(w)].slice(0,14);save();return q.memoryKeywords
}
function openMemoryHub(b){
 let book=D.books.find(x=>x.id===b),n=subjectiveQs(b).length;page('study');
 $('studyArea').innerHTML=`<button class="sheetBack" onclick="openBookV3('${b}')">‹ 返回错题本</button><h2>${esc(book?.name||book?.title||'错题本')} · 记背</h2><div class="memSub">${n} 道简答 / 论述题 · 只使用当前错题本</div><div class="memModes">
 <button class="memMode" onclick="startMemMode('${b}','keywords')"><b>① 词炼速背</b><span>关键词骨架，快速回忆</span></button>
 <button class="memMode" onclick="startMemMode('${b}','keycloze')"><b>② 关键词填空</b><span>手动填写核心词炼</span></button>
 <button class="memMode" onclick="startMemMode('${b}','bridge')"><b>③ 衔接填空</b><span>保留关键词，补齐表达</span></button>
 <button class="memMode" onclick="startMemMode('${b}','full')"><b>④ 完整复述</b><span>只看题目，默写答案</span></button></div>`
}
function startMemMode(b,m){memV34={book:b,mode:m,i:0};drawMemV34()}
function memNav(d){let q=subjectiveQs(memV34.book),n=memV34.i+d;if(n<0||n>=q.length)return;memV34.i=n;drawMemV34()}
function drawMemV34(){
 let qs=subjectiveQs(memV34.book),q=qs[memV34.i];if(!q){openMemoryHub(memV34.book);return}let kw=autoKeywords(q),body='';
 if(memV34.mode==='keywords')body=`<div class="keywordChips">${kw.map(k=>`<span class="keywordChip">${esc(k)}</span>`).join('')}</div><button class="secondary" style="width:100%;margin-top:12px" onclick="toggleMemAnswer()">显示 / 隐藏完整答案</button><div id="memAns" class="answerReveal" style="display:none">${esc(answerOf(q))}</div><button class="secondary" style="width:100%;margin-top:8px" onclick="editKeywordsV34('${q.id}')">编辑词炼</button>`;
 if(memV34.mode==='keycloze')body=`${kw.map((k,i)=>`<div style="margin:9px 0">${i+1}. <input class="clozeInput" placeholder="关键词"> <span id="ka${i}" style="display:none">→ ${esc(k)}</span></div>`).join('')}<button class="secondary" style="width:100%" onclick="document.querySelectorAll('[id^=ka]').forEach(x=>x.style.display='inline')">显示词炼答案</button>`;
 if(memV34.mode==='bridge'){let parts=answerOf(q).split(/([，。；：\n])/),i=0;body=`<div style="line-height:2">${parts.map(p=>{if(!p||/^[，。；：\n]$/.test(p))return esc(p);if(kw.some(k=>p.includes(k)))return esc(p);if(p.trim().length>=4&&i++<12)return `<input class="clozeInput" style="width:150px" placeholder="补衔接">`;return esc(p)}).join('')}</div><button class="secondary" style="width:100%;margin-top:10px" onclick="toggleMemAnswer()">显示 / 隐藏完整答案</button><div id="memAns" class="answerReveal" style="display:none">${esc(answerOf(q))}</div>`}
 if(memV34.mode==='full')body=`<textarea class="memTextarea" placeholder="尝试默写完整答案……"></textarea><button class="secondary" style="width:100%;margin-top:10px" onclick="toggleMemAnswer()">对照标准答案</button><div id="memAns" class="answerReveal" style="display:none">${esc(answerOf(q))}</div>`;
 $('studyArea').innerHTML=`<button class="sheetBack" onclick="openMemoryHub('${memV34.book}')">‹ 记背模式</button><div class="memCard"><div class="memQuestion">${esc(q.text)}</div>${body}<div class="memProgress"><div>词炼<br>${stars(q.memK||0)}</div><div>关键词<br>${stars(q.memC||0)}</div><div>衔接<br>${stars(q.memB||0)}</div><div>复述<br>${stars(q.memF||0)}</div></div><div class="row" style="margin-top:12px"><button class="secondary" onclick="rateMemV34(1)">还不会</button><button class="secondary" onclick="rateMemV34(3)">基本会</button><button class="primary" onclick="rateMemV34(5)">已掌握</button></div><div class="row" style="margin-top:9px"><button class="secondary" onclick="memNav(-1)">‹ 上一题</button><span class="small">${memV34.i+1} / ${qs.length}</span><button class="secondary" onclick="memNav(1)">下一题 ›</button></div></div>`
}
function stars(n){n=Math.max(0,Math.min(5,n));return '★'.repeat(n)+'☆'.repeat(5-n)}
function toggleMemAnswer(){let x=$('memAns');if(x)x.style.display=x.style.display==='none'?'block':'none'}
function rateMemV34(v){let q=subjectiveQs(memV34.book)[memV34.i];if(!q)return;let k={keywords:'memK',keycloze:'memC',bridge:'memB',full:'memF'}[memV34.mode];q[k]=v;save();memNav(1)}
function editKeywordsV34(id){let q=D.qs.find(x=>x.id===id);if(!q)return;let v=prompt('编辑词炼：用 / 分隔关键词或短语',autoKeywords(q).join(' / '));if(v===null)return;q.memoryKeywords=v.split('/').map(x=>x.trim()).filter(Boolean);save();drawMemV34()}

let readerV3={book:null,i:0};
function bookTitleV3(b){return b.title||b.name||'错题本'}
function bookIdOf(q){return q.book||q.bookId}
function fontClassV3(f){return f==='serif'?'serif':f==='hand'?'hand':''}
function paperNameV3(p){return {ruled:'浅粉横线',dot:'灰粉点阵',clean:'奶油空白',floral:'复古花边',grid:'淡粉方格'}[p]||'浅粉横线'}
function ensureBookV3(b,i){if(!b.title)b.title=b.name||'错题本';if(!b.coverColor)b.coverColor=V3COLORS[i%V3COLORS.length];if(!b.font)b.font='sans';if(!b.paper)b.paper=['ruled','dot','clean','floral','grid'][i%5];if(!b.coverImage)b.coverImage='';if(!b.titleColor)b.titleColor='#ffffff';if(b.strokeWidth===undefined)b.strokeWidth=0;if(!b.strokeColor)b.strokeColor='#000000';return b}
D.books.forEach(ensureBookV3);save();
newBook=function(){editBookV3('')}
function editBookV3(id=''){let b=D.books.find(x=>x.id===id)||{title:'',sub:'',coverColor:V3COLORS[0],coverImage:'',font:'sans',paper:'ruled',titleColor:'#ffffff',strokeWidth:0,strokeColor:'#000000'};ensureBookV3(b,0);pendingCover=b.coverImage||'';modal(`<div class="sheetBar"><button class="sheetBack" onclick="closeM()">‹ 返回</button><b>${id?'编辑错题本':'新建错题本'}</b><button class="sheetClose" onclick="closeM()">×</button></div><label>错题本名称</label><input id="v3bn" value="${esc(bookTitleV3(b))}" placeholder="例如：艺术概论"><label>副标题 / 科目</label><input id="v3bs" value="${esc(b.sub||'')}" placeholder="例如：专升本 · 艺术概论"><label>纯色封面</label><div class="swatches">${V3COLORS.map(c=>`<button class="sw ${b.coverColor===c?'on':''}" style="background:${c}" onclick="chooseV3Color('${c}',this)"></button>`).join('')}</div><label>或者上传自己的封面照片</label><button class="secondary" style="width:100%" onclick="$('coverInput').click()">从相册选择封面</button><div id="v3coverStatus" class="small" style="margin-top:6px">${b.coverImage?'已使用自定义封面':'当前使用纯色封面'}</div><label>封面标题字体</label><div class="choices"><button class="choice ${b.font==='sans'?'on':''}" onclick="chooseV3('font','sans',this)">极简黑体</button><button class="choice ${b.font==='serif'?'on':''}" onclick="chooseV3('font','serif',this)" style="font-family:Georgia,serif">衬线体</button><button class="choice ${b.font==='hand'?'on':''}" onclick="chooseV3('font','hand',this)" style="font-family:KaiTi,serif">手写感</button></div><label>字体颜色 / 描边颜色</label><div class="colorRow"><div class="colorCtl"><span>字体颜色</span><input id="v3titleColor" type="color" value="${b.titleColor||'#ffffff'}"></div><div class="colorCtl"><span>描边颜色</span><input id="v3strokeColor" type="color" value="${b.strokeColor||'#000000'}"></div></div><label>字体描边</label><select id="v3strokeWidth"><option value="0" ${Number(b.strokeWidth||0)===0?'selected':''}>关闭描边</option><option value="1" ${Number(b.strokeWidth||0)===1?'selected':''}>细描边</option><option value="2" ${Number(b.strokeWidth||0)===2?'selected':''}>中描边</option><option value="3" ${Number(b.strokeWidth||0)===3?'selected':''}>粗描边</option></select><label>这本错题本的内页</label><div class="choices"><button class="choice ${b.paper==='ruled'?'on':''}" onclick="chooseV3('paper','ruled',this)">浅粉横线</button><button class="choice ${b.paper==='dot'?'on':''}" onclick="chooseV3('paper','dot',this)">灰粉点阵</button><button class="choice ${b.paper==='clean'?'on':''}" onclick="chooseV3('paper','clean',this)">奶油空白</button><button class="choice ${b.paper==='floral'?'on':''}" onclick="chooseV3('paper','floral',this)">复古花边</button><button class="choice ${b.paper==='grid'?'on':''}" onclick="chooseV3('paper','grid',this)">淡粉方格</button></div><input id="v3color" type="hidden" value="${b.coverColor}"><input id="v3font" type="hidden" value="${b.font}"><input id="v3paper" type="hidden" value="${b.paper}"><div class="row" style="margin-top:16px"><button class="secondary" onclick="closeM()">取消</button><button class="primary" style="flex:1" onclick="saveBookV3('${id}')">保存</button></div>${id?`<button class="secondary danger" style="width:100%;margin-top:9px" onclick="deleteBookV3('${id}')">删除错题本</button>`:''}`)}
function chooseV3Color(c,el){$('v3color').value=c;pendingCover='';document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('v3coverStatus').textContent='已选择纯色封面'}
function chooseV3(type,val,el){$(type==='font'?'v3font':'v3paper').value=val;el.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
$('coverInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{pendingCover=r.result;if($('v3coverStatus'))$('v3coverStatus').textContent='已选择自定义封面照片'};r.readAsDataURL(f)}
function saveBookV3(id){let title=$('v3bn').value.trim();if(!title)return alert('请输入错题本名称');let obj={title,name:title,sub:$('v3bs').value.trim(),coverColor:$('v3color').value,coverImage:pendingCover,font:$('v3font').value,paper:$('v3paper').value,titleColor:$('v3titleColor').value,strokeColor:$('v3strokeColor').value,strokeWidth:Number($('v3strokeWidth').value)};let b=D.books.find(x=>x.id===id);if(b)Object.assign(b,obj);else D.books.push({id:uid(),...obj});if(save()){closeM();renderV3Books()}}
function deleteBookV3(id){if(!confirm('删除这本错题本？其中题目也会删除。'))return;D.books=D.books.filter(b=>b.id!==id);D.qs=D.qs.filter(q=>bookIdOf(q)!==id);closeM();save();renderV3Books()}
function coverStyleV3(b){return b.coverImage?`background-image:url('${b.coverImage}')`:`background:${b.coverColor||V3COLORS[0]}`}
function renderV3Books(){let host=$('books');if(!host)return;host.className='bookshelf';host.innerHTML=D.books.map((b,i)=>{ensureBookV3(b,i);let n=D.qs.filter(q=>bookIdOf(q)===b.id).length;return `<div class="bookWrap"><button class="bookCard" onclick="openBookV3('${b.id}')"><div class="coverBg" style="${coverStyleV3(b)}"></div><div class="coverShade"></div><div class="bookTitle ${fontClassV3(b.font)}" style="color:${b.titleColor||'#fff'};-webkit-text-stroke:${Number(b.strokeWidth||0)}px ${b.strokeColor||'#000'};text-shadow:${Number(b.strokeWidth||0)>0?'none':'0 1px 5px #0005'}">${esc(bookTitleV3(b))}</div><div class="bookSub">${esc(b.sub||`${n} 道题`)}</div></button><button class="bookEdit" onclick="event.stopPropagation();editBookV3('${b.id}')">✎</button></div>`}).join('')+`<button class="addBook" onclick="editBookV3()"><b>＋</b><span>添加错题本</span></button>`}
function openBookV3(id){readerV3={book:id,i:0};page('reader');drawReaderV3()}
function readerPick(qid,i){
  let q=D.qs.find(x=>x.id===qid),ans=String(q.ans||q.answer||'').toUpperCase(),btns=[...document.querySelectorAll('.readerOpt')];
  btns.forEach(x=>x.disabled=true);
  btns.forEach((x,j)=>{if('ABCD'[j]===ans)x.classList.add('ok')});
  const correct='ABCD'[i]===ans;
  if(!correct)btns[i].classList.add('bad');
  $('readerFb').innerHTML=correct?'<b>回答正确 ✓</b><div class="autoNextHint">即将进入下一题</div>':`<b>回答错误</b><br>正确答案：${esc(ans)}`;
  if(correct){setTimeout(()=>{const qs=D.qs.filter(x=>bookIdOf(x)===readerV3.book);if(readerV3.i<qs.length-1)turnV3(1)},520)}
}
function showReaderAns(){$('readerAns').style.display='block';$('readerShow').style.display='none'}
function drawReaderV3(dir=''){let b=D.books.find(x=>x.id===readerV3.book);if(!b)return;let qs=D.qs.filter(q=>bookIdOf(q)===b.id),q=qs[readerV3.i],body='';if(!q)body=`<div class="bookEmpty">这本错题本还没有题目</div>`;else if(q.type==='choice'){let opts=q.opts||q.options||[];body=`<div class="paperInner"><div class="paperHead"><span>${esc(bookTitleV3(b))}</span><span>错题笔记</span></div><div class="qCard"><span class="tag">选择题</span><div class="qText">${esc(q.text)}</div>${opts.map((o,i)=>`<button class="opt readerOpt" onclick="readerPick('${q.id}',${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}<div id="readerFb" class="qAnswer"></div></div></div>`}else body=`<div class="paperInner"><div class="paperHead"><span>${esc(bookTitleV3(b))}</span><span>错题笔记</span></div><div class="qCard"><span class="tag">${typeN(q.type)}</span><div class="qText">${esc(q.text)}</div><button id="readerShow" class="primary" style="width:100%" onclick="showReaderAns()">显示正确答案</button><div id="readerAns" class="hiddenAns"><b>参考答案</b><br>${esc(q.answer||q.answerText||'')}</div></div></div>`;$('readerArea').innerHTML=`<div class="readerTop"><button class="circleBtn" onclick="page('home');renderV3Books()">‹</button><div class="readerName"><b>${esc(bookTitleV3(b))}</b><span class="small">${qs.length} 道题 · ${paperNameV3(b.paper)}</span></div><button class="circleBtn" onclick="editBookV3('${b.id}')">✎</button><button class="circleBtn" onclick="editQ('choice','${b.id}')">＋</button></div><div class="modeBar"><button class="modeBtn on">错题笔记</button><button class="modeBtn" onclick="startSubjectQuiz('${b.id}')">随机刷题</button><button class="modeBtn" onclick="startSubjectMemory('${b.id}')">背诵复习</button></div><div class="readerStage"><div class="paper ${b.paper||'ruled'} ${dir}"><button class="pageTapZone left" aria-label="上一题" onclick="turnV3(-1)"></button><button class="pageTapZone right" aria-label="下一题" onclick="turnV3(1)"></button>${body}${qs.length?`<div class="pager"><span class="pageNo">${readerV3.i+1} / ${qs.length}</span></div>`:''}</div></div>`}
function turnV3(d){let qs=D.qs.filter(q=>bookIdOf(q)===readerV3.book),n=readerV3.i+d;if(n<0||n>=qs.length)return;readerV3.i=n;drawReaderV3(d>0?'turnNext':'turnPrev')}
</script>
</body></html>
