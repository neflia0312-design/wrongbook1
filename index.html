<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2"><title>我的错题本 V2</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--txt:#20201e;--mut:#898880;--line:#e7e5de;--ok:#738474;--bad:#b46d69}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit}button{border:0;color:inherit}.app{max-width:720px;margin:auto;padding-bottom:82px;min-height:100vh}
header{padding:26px 18px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;margin:0}.mut,.small{color:var(--mut);font-size:12px}
main{padding:0 15px}.page{display:none}.page.on{display:block}.card,.item{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary,.secondary{padding:12px 15px;border-radius:14px}.primary{background:#20201e;color:#fff;font-weight:700}.secondary{background:#eeede8}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.stat{font-size:28px;font-weight:800}.section{font-weight:750;margin:20px 3px 10px}.book{min-height:120px}.cover{height:55px;border-radius:14px;margin-bottom:11px;padding:9px;color:#fff;display:flex;align-items:flex-end;font-weight:700;background:linear-gradient(135deg,#788171,#b7bbad)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:68px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;z-index:5}nav button{flex:1;background:none;color:var(--mut);font-size:11px}nav button.on{color:var(--txt);font-weight:800}nav b{display:block;font-size:20px}
.fab{position:fixed;right:20px;bottom:80px;width:58px;height:58px;border-radius:19px;background:#20201e;color:white;font-size:28px;z-index:6}
.modal{display:none;position:fixed;inset:0;background:#0005;align-items:flex-end;z-index:10}.modal.on{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:var(--bg);border-radius:27px 27px 0 0;padding:19px;max-height:92vh;overflow:auto}
label{display:block;font-size:12px;color:var(--mut);margin:13px 0 6px}input,textarea,select{width:100%;background:white;border:1px solid var(--line);border-radius:13px;padding:12px;font-size:16px}textarea{min-height:86px}
.tabs{display:flex;gap:6px;overflow:auto}.tab{white-space:nowrap;padding:9px 11px;border-radius:11px;background:#ecebe6}.tab.on{background:#20201e;color:#fff}
.tag{display:inline-block;padding:4px 7px;background:#efeee9;border-radius:8px;font-size:11px;color:#666;margin:0 4px 5px 0}.q{font-size:21px;font-weight:750;line-height:1.55;margin:18px 0}
.options{display:grid;gap:9px}.opt{padding:14px;border:1px solid var(--line);border-radius:15px;background:white;text-align:left}.opt.ok{background:#eef5ee;border-color:#819681}.opt.bad{background:#f8eeee;border-color:#bd7b77}
.quiz{min-height:60vh;display:flex;flex-direction:column;justify-content:center}.answer{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);white-space:pre-wrap;line-height:1.8}.search{margin-bottom:10px}.photo{width:100%;max-height:300px;object-fit:contain;border-radius:14px;display:none;margin-top:10px}.photoBox{padding:18px;border:1px dashed #c9c7be;border-radius:17px;text-align:center;background:#fff}
.note{font-size:12px;color:#6c6b64;background:#eeede8;padding:11px;border-radius:13px;line-height:1.6}.cloze{font-size:18px;line-height:1.9}.blank{border-bottom:1.5px solid #555;color:transparent;padding:0 4px}.blank.show{color:inherit}.danger{color:#b46d69}
</style></head>
<body>
<div class="app"><header><div><h1>我的错题本</h1><div class="mut" id="today"></div></div><button class="secondary" onclick="newBook()">＋ 科目</button></header>
<main>
<section id="home" class="page on"><div class="card row between"><div><div class="small">今日待背</div><div class="stat" id="due">0</div></div><button class="primary" onclick="startMemory()">开始复习</button></div><div class="section">错题本</div><div class="grid" id="books"></div><div class="section">学习概览</div><div class="grid"><div class="card"><div class="small">总题目</div><div class="stat" id="total">0</div></div><div class="card"><div class="small">已掌握</div><div class="stat" id="master">0</div></div></div></section>
<section id="bank" class="page"><div class="section">题库</div><input class="search" id="search" placeholder="搜索题目 / 知识点" oninput="renderBank()"><div id="bankList"></div></section>
<section id="study" class="page"><div id="studyArea"></div></section>
<section id="set" class="page"><div class="section">设置</div><div class="card"><b>备份</b><p class="small">题库保存在当前浏览器。建议定期导出。</p><div class="row"><button class="secondary" onclick="exportData()">导出</button><button class="secondary" onclick="document.getElementById('imp').click()">导入</button></div></div></section>
</main>
<button class="fab" onclick="addMenu()">＋</button>
<nav><button class="on" onclick="page('home',this)"><b>⌂</b>首页</button><button onclick="page('bank',this)"><b>▤</b>题库</button><button onclick="page('study',this);studyHub()"><b>◉</b>刷题/背诵</button><button onclick="page('set',this)"><b>⚙</b>设置</button></nav></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<input id="camera" type="file" accept="image/*" capture="environment" hidden>
<input id="album" type="file" accept="image/*" hidden><input id="imp" type="file" accept=".json" hidden>
<script>
const K='wrongbook_v2_fixed'; let D=JSON.parse(localStorage.getItem(K)||'null')||{books:[],qs:[]}; let mem={list:[],i:0}, quiz={list:[],i:0,score:0,locked:false};
const $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), day=()=>Math.floor(Date.now()/86400000);
function save(){localStorage.setItem(K,JSON.stringify(D));render()}
function page(x,b){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));$(x).classList.add('on');document.querySelectorAll('nav button').forEach(e=>e.classList.remove('on'));if(b)b.classList.add('on');if(x==='bank')renderBank()}
function modal(h){$('sheet').innerHTML=h;$('modal').classList.add('on')} function closeM(){$('modal').classList.remove('on')} $('modal').onclick=e=>{if(e.target.id==='modal')closeM()}
function newBook(){modal(`<h2>新建错题本</h2><label>名称</label><input id="bn" placeholder="例如：艺术概论"><label>科目说明</label><input id="bs" placeholder="例如：专升本"><div class="row" style="margin-top:17px"><button class="secondary" onclick="closeM()">取消</button><button class="primary" style="flex:1" onclick="saveBook()">创建</button></div>`)}
function saveBook(){if(!$('bn').value.trim())return alert('请输入名称');D.books.push({id:id(),name:$('bn').value.trim(),sub:$('bs').value.trim()});closeM();save()}
function addMenu(){modal(`<h2>添加题目</h2><div class="grid"><button class="card" onclick="photoMode()">📷<br><b>拍照录题</b><p class="small">相机 / 相册</p></button><button class="card" onclick="editQ('choice')">✎<br><b>手动录入</b><p class="small">四种题型</p></button></div>`)}
function booksOpt(){return D.books.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}
function editQ(t='choice',p={}){if(!D.books.length){closeM();return newBook()}modal(`<h2>录入题目</h2><div class="tabs">${[['choice','选择题'],['short','简答题'],['essay','论述题'],['cloze','背诵填词']].map(x=>`<button class="tab ${t===x[0]?'on':''}" onclick="editQ('${x[0]}')">${x[1]}</button>`).join('')}</div><label>错题本</label><select id="qb">${booksOpt()}</select><label>题目</label><textarea id="qt">${esc(p.text||'')}</textarea>${t==='choice'?`<label>选项</label>${['A','B','C','D'].map((x,i)=>`<div class="row" style="margin-bottom:7px"><b>${x}</b><input id="o${i}" value="${esc((p.opts||[])[i]||'')}"></div>`).join('')}<label>正确答案</label><select id="qa">${['A','B','C','D'].map(x=>`<option ${p.ans===x?'selected':''}>${x}</option>`).join('')}</select>`:`<label>标准答案 / 背诵原文</label><textarea id="qat">${esc(p.answer||'')}</textarea><label>挖空关键词（逗号分隔，可选）</label><input id="kw" value="${esc(p.kw||'')}" placeholder="模仿说,游戏说,巫术说">`}<label>知识点</label><input id="tag"><label>备注 / 错因</label><textarea id="note"></textarea><button class="primary" style="width:100%;margin-top:15px" onclick="saveQ('${t}')">保存题目</button>`)}
function saveQ(t){let text=$('qt').value.trim();if(!text)return alert('请输入题目');let q={id:id(),type:t,book:$('qb').value,text,tag:$('tag').value.trim(),note:$('note').value.trim(),level:0,next:day(),right:0,wrong:0};if(t==='choice'){q.opts=[0,1,2,3].map(i=>$('o'+i).value.trim());if(q.opts.some(x=>!x))return alert('请填写完整四个选项');q.ans=$('qa').value}else{q.answer=$('qat').value.trim();if(!q.answer)return alert('请填写标准答案');q.kw=$('kw').value.trim()}D.qs.push(q);closeM();save()}
function photoMode(){if(!D.books.length){closeM();return newBook()}modal(`<h2>拍照录题</h2><div class="photoBox"><b>拍摄题目</b><p class="small">请尽量正对纸面、保证光线均匀。</p><div class="row" style="justify-content:center"><button class="primary" onclick="$('camera').click()">拍照</button><button class="secondary" onclick="$('album').click()">相册</button></div><img id="preview" class="photo"></div><div class="note" style="margin-top:10px">V2 支持 iPhone 相机/相册录入。由于静态网页不能安全保存 OCR/AI 密钥，自动识字暂采用 iPhone 图片“实况文本/复制文字”后粘贴的方式；粘贴后会自动拆分常见选择题。</div><label>粘贴图片识别出的文字</label><textarea id="ocr" placeholder="长按图片复制文字后粘贴到这里"></textarea><button class="primary" style="width:100%;margin-top:10px" onclick="parseOCR()">识别并整理</button>`)}
function bindPic(el){el.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let p=$('preview');if(p){p.src=r.result;p.style.display='block'}};r.readAsDataURL(f)}} bindPic($('camera'));bindPic($('album'));
function parseOCR(){let raw=$('ocr').value.trim();if(!raw)return alert('请先粘贴识别文字');let ls=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean),opts=[],txt=[],ans='';ls.forEach(l=>{let m=l.match(/^([A-D])[\.、\s:：]+(.+)$/i);if(m)opts['ABCD'.indexOf(m[1].toUpperCase())]=m[2];else if(/^答案[:：\s]*[A-D]/i.test(l)){let a=l.match(/[A-D]/i);if(a)ans=a[0].toUpperCase()}else txt.push(l)});editQ(opts.filter(Boolean).length>=2?'choice':'short',{text:txt.join('\n'),opts:opts,ans:ans})}
function typeN(t){return {choice:'选择题',short:'简答题',essay:'论述题',cloze:'背诵填词'}[t]}
function render(){let b=$('books');b.innerHTML=D.books.length?D.books.map(x=>{let qs=D.qs.filter(q=>q.book===x.id);return `<div class="card book"><div class="cover">${esc(x.sub||'学习')}</div><b>${esc(x.name)}</b><p class="small">${qs.length} 道题 · ${qs.filter(q=>q.type!=='choice'&&q.next<=day()).length} 待背</p></div>`}).join(''):'<div class="card" style="grid-column:1/-1;text-align:center;color:#888">点击右上角创建第一个错题本</div>';$('total').textContent=D.qs.length;$('master').textContent=D.qs.filter(q=>q.level>=3).length;$('due').textContent=D.qs.filter(q=>q.type!=='choice'&&q.next<=day()).length;renderBank()}
function renderBank(){let s=($('search')?.value||'').toLowerCase(),qs=D.qs.filter(q=>(q.text+' '+(q.tag||'')).toLowerCase().includes(s));$('bankList').innerHTML=qs.length?qs.slice().reverse().map(q=>`<div class="item"><span class="tag">${typeN(q.type)}</span><b style="display:block">${esc(q.text)}</b><p class="small">${esc(q.tag||'未设置知识点')} · 记忆等级 ${q.level||0}</p></div>`).join(''):'<div class="card" style="text-align:center;color:#888">暂无题目</div>'}
function studyHub(){$('studyArea').innerHTML=`<div class="section">练习模式</div><div class="grid"><button class="card" onclick="startQuiz()"><div class="stat">${D.qs.filter(q=>q.type==='choice').length}</div><b>选择题刷题</b><p class="small">每轮自动打乱选项</p></button><button class="card" onclick="startMemory()"><div class="stat">${D.qs.filter(q=>q.type!=='choice').length}</div><b>背诵巩固</b><p class="small">简答 / 论述 / 填词</p></button></div>`}
function startQuiz(){page('study');quiz={list:D.qs.filter(q=>q.type==='choice').sort(()=>Math.random()-.5),i:0,score:0,locked:false};drawQuiz()}
function drawQuiz(){if(!quiz.list.length){$('studyArea').innerHTML='<div class="quiz" style="text-align:center">暂无选择题</div>';return}let q=quiz.list[quiz.i],arr=q.opts.map((t,i)=>({t,orig:'ABCD'[i]})).sort(()=>Math.random()-.5);q.tmp=arr;$('studyArea').innerHTML=`<div class="quiz"><div class="small">${quiz.i+1}/${quiz.list.length} · 得分 ${quiz.score}</div><div class="q">${esc(q.text)}</div><div class="options">${arr.map((o,i)=>`<button id="op${i}" class="opt" onclick="pick('${q.id}',${i})">${'ABCD'[i]}. ${esc(o.t)}</button>`).join('')}</div><div id="fb"></div></div>`}
function pick(qid,i){if(quiz.locked)return;quiz.locked=true;let q=D.qs.find(x=>x.id===qid),ok=q.tmp[i].orig===q.ans;if(ok){quiz.score++;q.right++}else q.wrong++;$('op'+i).classList.add(ok?'ok':'bad');q.tmp.forEach((o,j)=>{if(o.orig===q.ans)$('op'+j).classList.add('ok')});$('fb').innerHTML=`<button class="primary" style="width:100%;margin-top:12px" onclick="nextQuiz()">下一题</button>`;save()}
function nextQuiz(){quiz.i++;quiz.locked=false;if(quiz.i>=quiz.list.length){$('studyArea').innerHTML=`<div class="quiz" style="text-align:center"><h2>完成</h2><div class="stat">${quiz.score}/${quiz.list.length}</div><button class="primary" onclick="startQuiz()">再刷一轮</button></div>`}else drawQuiz()}
function startMemory(){page('study');let due=D.qs.filter(q=>q.type!=='choice'&&q.next<=day());mem={list:(due.length?due:D.qs.filter(q=>q.type!=='choice')).sort((a,b)=>(a.level||0)-(b.level||0)),i:0};drawMem()}
function cloze(q){let text=esc(q.answer),ks=(q.kw||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean);if(!ks.length)ks=q.answer.split(/[，。；、\s]/).filter(x=>x.length>=3).slice(0,5);ks.forEach(k=>{text=text.split(esc(k)).join(`<span class="blank">${esc(k)}</span>`)});return text}
function drawMem(){if(!mem.list.length){$('studyArea').innerHTML='<div class="quiz" style="text-align:center">还没有简答/论述/填词题</div>';return}let q=mem.list[mem.i];$('studyArea').innerHTML=`<div class="quiz"><div class="small">${mem.i+1}/${mem.list.length} · 记忆等级 ${q.level||0}</div><span class="tag">${typeN(q.type)}</span><div class="q">${esc(q.text)}</div><div class="card">${q.type==='cloze'?`<div class="cloze">${cloze(q)}</div>`:`<div id="ans" class="answer">${esc(q.answer)}</div>`}<button id="reveal" class="primary" style="width:100%;margin-top:13px" onclick="reveal('${q.id}')">显示答案</button><div id="rate" style="display:none;margin-top:12px"><div class="small">刚才回忆得怎么样？</div><div class="grid" style="margin-top:8px"><button class="secondary" onclick="rate('${q.id}',0)">完全忘记</button><button class="secondary" onclick="rate('${q.id}',1)">有印象</button><button class="secondary" onclick="rate('${q.id}',2)">基本会</button><button class="secondary" onclick="rate('${q.id}',3)">熟练</button></div></div></div></div>`}
function reveal(qid){let q=D.qs.find(x=>x.id===qid);if(q.type==='cloze')document.querySelectorAll('.blank').forEach(x=>x.classList.add('show'));else $('ans').style.display='block';$('reveal').style.display='none';$('rate').style.display='block'}
function rate(qid,g){let q=D.qs.find(x=>x.id===qid),iv=[0,1,3,7];q.level=Math.max(0,Math.min(5,(q.level||0)+(g>=2?1:-1)));q.next=day()+iv[g];g? q.right++:q.wrong++;save();mem.i++;if(mem.i>=mem.list.length)$('studyArea').innerHTML='<div class="quiz" style="text-align:center"><h2>今日复习完成 ✓</h2><p class="small">系统已经安排下一次复习。</p><button class="primary" onclick="startMemory()">再复习一轮</button></div>';else drawMem()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='错题本V2备份.json';a.click()}
$('imp').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();alert('导入成功')}catch(e){alert('备份文件无效')}};r.readAsText(f)}
$('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});render();
</script></body></html>
